[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "telegraf-mdt-collector"

# Receive IOS-XR gRPC dial-out (GPB-KV / self-describing-gpb)
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57400"
  max_msg_size = 32000000

  [inputs.cisco_telemetry_mdt.aliases]
    ifstats = "Cisco-IOS-XR-infra-statsd-oper:infra-statistics/interfaces/interface/generic-counters"

  [inputs.cisco_telemetry_mdt.grpc_enforcement_policy]
    permit_keepalive_without_calls = true
    keepalive_minimum_time = "1m"

# Debug: log decoded metrics locally (disable in production)
# [[outputs.file]]
#   files = ["/tmp/telegraf-mdt.json"]
#   data_format = "json"

# Send numeric metrics to Splunk metrics index via HEC. Outputs fan out: every
# metric goes to all of them, each with its own buffer, so one unreachable
# endpoint does not stall the others. Neither output names an index — routing
# comes from the HEC token's default index, which must be of type Metrics.

# Local lab Splunk
[[outputs.http]]
  url = "https://198.18.201.42:8088/services/collector"
  method = "POST"
  timeout = "10s"
  insecure_skip_verify = true   # self-signed cert on the lab instance
  data_format = "splunkmetric"
  splunkmetric_hec_routing = true
  [outputs.http.headers]
    Content-Type = "application/json"
    # HEC requires the literal prefix "Splunk " before the token value.
    Authorization = "Splunk 70937d0d-3281-4853-b9fa-4a4030f1d252"
    X-Splunk-Request-Channel = "11111111-2222-3333-4444-555555555501"

# dCloud-hosted Splunk. Token comes from the environment so it stays out of
# git; set SPLUNK_CLOUD_HEC_TOKEN in /etc/default/telegraf (chmod 600).
# Splunk's default cert is self-signed and carries no IP SANs, so verifying it
# against a bare IP can never succeed. This is a lab address in RFC 2544 space
# reached over dCloud rather than the public internet, so the exposure matches
# the local output above. To verify properly instead, copy the instance's
# $SPLUNK_HOME/etc/auth/cacert.pem to this node and set tls_ca along with
# tls_server_name = "SplunkServerDefaultCert" to match the cert's CN.
[[outputs.http]]
  url = "https://198.19.224.190:8088/services/collector"
  method = "POST"
  timeout = "10s"
  insecure_skip_verify = true   # self-signed default cert, no IP SANs
  data_format = "splunkmetric"
  splunkmetric_hec_routing = true
  [outputs.http.headers]
    Content-Type = "application/json"
    Authorization = "Splunk ${SPLUNK_CLOUD_HEC_TOKEN}"
    X-Splunk-Request-Channel = "11111111-2222-3333-4444-555555555502"