! 
router isis 100
 net 49.0001.0000.0000.0254.00
 distribute link-state level 2
 nsf ietf
 address-family ipv6 unicast
  metric-style wide
  advertise link attributes
  maximum-paths 32
  segment-routing srv6
   locator MAIN
   !
  !
