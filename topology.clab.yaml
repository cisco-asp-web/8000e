name: hosts-clab
prefix: ""

mgmt:
  network: mgt
  ipv4-subnet: 172.20.19.0/24

topology:
  nodes:

    dc0-host00:
      kind: linux
      image: alpine-srv6-scapy:1.0
      mgmt-ipv4: 172.20.19.200
      exec:
        - "ip -6 addr add 2001:db8:bbbb:00::2/64 dev eth1 nodad"
        - "ip -6 addr add 2001:db8:bbbb:00::2/64 dev eth2 nodad"
        - "ip -6 route add fc00:0000::/32 via 2001:db8:bbbb:00::1 dev eth1"
        - "ip -6 route add fc00:0001::/32 via 2001:db8:bbbb:00::1 dev eth2"
        - "ip -6 route add 2001:db8:bbbb::/48 via 2001:db8:bbbb:00::1 dev eth1"

    dc0-host01:
      kind: linux
      image: alpine-srv6-scapy:1.0
      mgmt-ipv4: 172.20.19.201
      exec:
        - "ip -6 addr add 2001:db8:bbbb:01::2/64 dev eth1 nodad"
        - "ip -6 addr add 2001:db8:bbbb:01::2/64 dev eth2 nodad"
        - "ip -6 route add fc00:0000::/32 via 2001:db8:bbbb:01::1 dev eth1"
        - "ip -6 route add fc00:0001::/32 via 2001:db8:bbbb:01::1 dev eth2"
        - "ip -6 route add 2001:db8:bbbb::/48 via 2001:db8:bbbb:01::1 dev eth1"

    dc1-host00:
      kind: linux
      image: alpine-srv6-scapy:1.0
      mgmt-ipv4: 172.20.19.202
      exec:
        - "ip -6 addr add 2001:db8:bbbb:02::2/64 dev eth1 nodad"
        - "ip -6 addr add 2001:db8:bbbb:02::2/64 dev eth2 nodad"
        - "ip -6 route add fc00:0000::/32 via 2001:db8:bbbb:02::1 dev eth1"
        - "ip -6 route add fc00:0001::/32 via 2001:db8:bbbb:02::1 dev eth2"
        - "ip -6 route add 2001:db8:bbbb::/48 via 2001:db8:bbbb:02::1 dev eth1"

    dc1-host01:
      kind: linux
      image: alpine-srv6-scapy:1.0
      mgmt-ipv4: 172.20.19.203
      exec:
        - "ip -6 addr add 2001:db8:bbbb:03::2/64 dev eth1 nodad"
        - "ip -6 addr add 2001:db8:bbbb:03::2/64 dev eth2 nodad"
        - "ip -6 route add fc00:0000::/32 via 2001:db8:bbbb:03::1 dev eth1"
        - "ip -6 route add fc00:0001::/32 via 2001:db8:bbbb:03::1 dev eth2"
        - "ip -6 route add 2001:db8:bbbb::/48 via 2001:db8:bbbb:03::1 dev eth1"

    dc0-host00-l0:
      kind: bridge

    dc0-host00-l1:
      kind: bridge

    dc0-host01-l0:
      kind: bridge

    dc0-host01-l1:
      kind: bridge

    dc1-host00-l0:
      kind: bridge

    dc1-host00-l1:
      kind: bridge

    dc1-host01-l0:
      kind: bridge

    dc1-host01-l1:
      kind: bridge

  links:

    - endpoints: ["dc0-host00:eth1","dc0-host00-l0:dc0-host00-eth1"]
    - endpoints: ["dc0-host00:eth2","dc0-host00-l1:dc0-host00-eth2"]
    - endpoints: ["dc0-host01:eth1","dc0-host01-l0:dc0-host01-eth1"]
    - endpoints: ["dc0-host01:eth2","dc0-host01-l1:dc0-host01-eth2"]
    - endpoints: ["dc1-host00:eth1","dc1-host00-l0:dc1-host00-eth1"]
    - endpoints: ["dc1-host00:eth2","dc1-host00-l1:dc1-host00-eth2"]
    - endpoints: ["dc1-host01:eth1","dc1-host01-l0:dc1-host01-eth1"]
    - endpoints: ["dc1-host01:eth2","dc1-host01-l1:dc1-host01-eth2"]