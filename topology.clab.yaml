        - "ip -6 addr add 2001:db8:a000::1/128 dev lo nodad"
        - "ip -6 addr add 2001:db8:1:1::65/127 dev eth1 nodad"
        - "ip -6 addr add 2001:db8:1:1::69/127 dev eth2 nodad"
        - "ip -6 route add fc00:0000::/32 nexthop via 2001:db8:1:1::64 dev eth1 nexthop via 2001:db8:1:1::64 dev eth2"
        - "ip -6 route add 2001:db8:b000::/48 nexthop via 2001:db8:1:1::64 dev eth1 nexthop via 2001:db8:1:1::68 dev eth2"
        - "ip link add lo2 type dummy"
        - "ip addr add 2001:db8:a000::2/128 dev lo2 nodad"
        - "ip link set lo2 up"
        - "ip link add lo3 type dummy"
        - "ip addr add 2001:db8:a000::3/128 dev lo3 nodad"
