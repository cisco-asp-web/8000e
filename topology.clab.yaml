    - endpoints: ["dc00-p00-sar00:EH0_0_0_0", "dc01-p00-sar00:EH0_0_0_0"]
    - endpoints: ["dc00-p00-sar00:EH0_0_0_1", "dc01-p00-sar00:EH0_0_0_1"]
