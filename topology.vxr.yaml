      - dc0p0-node00.EightHundredGigE0/0/0/3
      - dc1p0-node00.EightHundredGigE0/0/0/3
      linux_bridge: p0l3

  # dc0p0-node01 and dc1p0-node01      
    p0l4:
      ports:
      - dc0p0-node01.EightHundredGigE0/0/0/0
      - dc1p0-node01.EightHundredGigE0/0/0/0
      linux_bridge: p0l4
      
