connections:
  custom:

  # dc0p0-node00 and dc1p0-node00
    p0l0:         
      ports:
      - dc0p0-node00.EightHundredGigE0/0/0/0
      - dc1p0-node00.EightHundredGigE0/0/0/0
      linux_bridge: p0l0
      
    p0l1: 
      ports:
      - dc0p0-node00.EightHundredGigE0/0/0/1
      - dc1p0-node00.EightHundredGigE0/0/0/1
      linux_bridge: p0l1
          
    p0l2: 
      ports:
      - dc0p0-node00.EightHundredGigE0/0/0/2
      - dc1p0-node00.EightHundredGigE0/0/0/2
      linux_bridge: p0l2
      
    p0l3:
