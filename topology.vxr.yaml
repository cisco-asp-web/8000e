
devices:
  dc0p0-node00:
    image: /home/cisco/images/8000-eft17.2/packages/images/8000/xr/26.2.1/8000-x64-26.2.1.iso
    cvac: config/dc0p0-node00.cfg
    platform: spitfire_f
    linecard_types: ['8223-64EF-M']
    npu_asic_versions: [A0]
    xr_port_redir: [22, 23]
    xr_config: |
      hostname dc0p0-node00
      ssh server vrf default
      ssh server rate-limit 600
      ssh server session-limit 100
      snmp-server community public RO
      ssh
      interface MgmtEth0/RP0/CPU0/0
       ipv4 address 192.168.122.200/24
       no shut

